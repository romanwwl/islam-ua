# Codemagic CI — Islam UA (Capacitor, iOS)
# Собирает .ipa на облачном Mac и загружает в TestFlight / App Store Connect.
# Ничего здесь менять не нужно, кроме APP_STORE_APPLE_ID, если у приложения другой Apple ID.

workflows:
  ios-testflight:
    name: Islam UA — iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Сборка стартует автоматически при пуше в ветку release (обычные коммиты в main не собираются).
    # Выпуск = git push origin main:release
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      # Имя интеграции App Store Connect в Codemagic:
      # Teams → Personal Account → Integrations → Developer Portal → "Codemagic"
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ua.islamua.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6815393222   # Apple ID приложения из App Store Connect (из URL страницы приложения)

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web app (Vite → www/)
        script: npm run build

      - name: Sync web assets into the iOS project
        script: npx cap sync ios

      - name: Apply code signing to Xcode project
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Set build number (auto-increment)
        script: |
          cd ios/App
          # Номер сборки должен быть строго больше предыдущего загруженного в App Store Connect.
          # Берём максимум из: последнего номера в TestFlight/App Store (если API ответил) и номера сборки Codemagic + 10.
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          echo "TestFlight latest: '${TF:-—}', App Store latest: '${AS:-—}', Codemagic build: $BUILD_NUMBER"
          case "$TF" in ''|*[!0-9]*) TF=0;; esac
          case "$AS" in ''|*[!0-9]*) AS=0;; esac
          NEXT=$(( (TF > AS ? TF : AS) + 1 ))
          CM=$(( BUILD_NUMBER + 10 ))
          [ "$CM" -gt "$NEXT" ] && NEXT=$CM
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: Build .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # на ревью отправляем вручную из App Store Connect
